[package]
name = "quantdsh-datahub"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "QuantDSH data daemon: DuckDB (market bars) + SQLite (metadata) behind a local HTTP API"

# The datahub is a standalone crate on purpose: `src-tauri/Cargo.toml` is NOT a
# workspace root (it has no `[workspace]` table), so this package is independent
# and gets its own `target/`. That costs one extra compile of the shared deps but
# keeps the known-good desktop carrier build graph untouched.

[[bin]]
name = "quantdsh-datahub"
path = "src/main.rs"

[lib]
name = "quantdsh_datahub"
path = "src/lib.rs"

[dependencies]
# ── HTTP ──
axum = "0.8"
tower = { version = "0.5", features = ["timeout", "util"] }
tower-http = { version = "0.6", features = ["cors", "trace"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }

# ── Serialization ──
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# ── Storage ──
# Engine version MUST stay in lockstep with the Node pin we validated earlier
# (`@duckdb/node-api@1.5.6-r.2`). The crate's own version number is NOT the
# engine version: `1.10506.1` == DuckDB engine 1.5.6, while `1.20000.0` would be
# engine 2.0.0. Pinning with `=` stops a `cargo update` from silently moving us
# to a different on-disk format.
duckdb = { version = "=1.10506.1", features = ["bundled"] }
rusqlite = { version = "0.41", features = ["bundled"] }

# ── Misc ──
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
csv = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
# 磁盘优先的发布构建（DuckDB bundled 全量 C++ 编译，磁盘大头在这里）：
# - debug = false：不带调试信息，cc 对 DuckDB C++ 也就不会再吐 -Z7 内嵌调试对象
#   （debug profile 下这套对象能膨胀到 15-20GB，曾撑爆整块盘）。
# - lto = false：thin-LTO 会把 bitcode 嵌进每个 rlib，依赖树大时多占数 GB。
# - codegen-units = 16：默认并行代码生成，缩短构建时间；二进制略大但可接受。
# - incremental = false：release 默认关闭，显式写死防止被环境变量打开。
# - strip = true：符号表不进最终二进制。
debug = false
lto = false
codegen-units = 16
incremental = false
strip = true
